[project]
name = "predictionmarket-pipeline"
version = "0.2.0"
description = "Collect, check and normalize live Polymarket order book data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyarrow>=15",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["coverage", "hypothesis", "pytest", "pytest-cov", "pytest-timeout", "ruff"]

[tool.setuptools]
packages = ["pipeline", "pipeline.polymarket"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # plain-English text may contain any characters
    "SIM105",  # try/except/pass is clearer than contextlib.suppress in a few places
    "SIM115",  # the raw store keeps files open across calls on purpose
    "SIM108",  # if/else blocks read more plainly than nested ternaries
    "RUF005",  # tuple concatenation is clear enough
    "SIM117",  # nested with-blocks read better in tests
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: talks to the real Polymarket API (opt in with: pytest -m live)",
    "slow: takes more than a few seconds",
]
timeout = 120
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
